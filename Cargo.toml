[package]
name = "soil-fem-3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "SolidCraft layered soil, geostatic initialization and MCC material foundation"

[dependencies]
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
