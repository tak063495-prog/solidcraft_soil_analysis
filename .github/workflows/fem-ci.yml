name: FEM build and verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-checks:
    name: ${{ matrix.group }} on Windows
    strategy:
      fail-fast: false
      matrix:
        group: [rust-core, rust-integration-0, rust-integration-1, python, verification]
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-reference.lock.txt
      - name: Install pinned dependencies and record sources
        run: |
          New-Item -ItemType Directory -Force runs/ci | Out-Null
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -r requirements-reference.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/freeze_sources.py runs/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose | Out-File runs/ci/rust-version.log
          python -m pip freeze | Out-File runs/ci/python-packages.log
      - name: Check formatting
        if: matrix.group == 'rust-core'
        run: cargo fmt --all --check
      - name: Check all Rust targets
        if: matrix.group == 'rust-core'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run discovered Rust test group
        if: startsWith(matrix.group, 'rust-')
        run: |
          python tools/run_ci_rust_tests.py --group ${{ matrix.group }} --output runs/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the CLI used by geometry tests
        if: matrix.group == 'python' || matrix.group == 'verification'
        run: cargo build --locked --release
      - name: Run all Python tests
        if: matrix.group == 'python'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath runs/ci/python-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath runs/ci/python-tools-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify small wet JOINT plate beam integration
        if: matrix.group == 'verification'
        run: |
          python tools/verify_wet_structures.py --solver target/release/soil-fem-3d.exe --output runs/ci/wet-structures 2>&1 | Tee-Object -FilePath runs/ci/wet-structures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify inherited SOIL water role and small members
        if: matrix.group == 'verification'
        run: |
          python tools/verify_wet_structures.py --solver target/release/soil-fem-3d.exe --output runs/ci/soil-wet-structures --water-mode soil 2>&1 | Tee-Object -FilePath runs/ci/soil-wet-structures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify nonzero SOIL volume source flow and small members
        if: matrix.group == 'verification'
        run: |
          python tools/verify_wet_structures.py --solver target/release/soil-fem-3d.exe --output runs/ci/soil-source-wet-structures --water-mode soil-source 2>&1 | Tee-Object -FilePath runs/ci/soil-source-wet-structures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify fixed PRESCRIBED reservoir and small members
        if: matrix.group == 'verification'
        run: |
          python tools/verify_wet_structures.py --solver target/release/soil-fem-3d.exe --output runs/ci/fixed-prescribed-wet-structures --water-mode prescribed-fixed 2>&1 | Tee-Object -FilePath runs/ci/fixed-prescribed-wet-structures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record bounded low preload NC diagnosis (not acceptance)
        if: matrix.group == 'verification'
        run: |
          python tools/probe_low_preload_nc.py --solver target/release/soil-fem-3d.exe --output runs/ci/low-preload-nc --budget-seconds 20 --grace-seconds 5 2>&1 | Tee-Object -FilePath runs/ci/low-preload-nc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure refined low preload NC and independent plastic fields (not acceptance)
        if: matrix.group == 'verification'
        run: |
          python tools/probe_low_preload_nc.py --solver target/release/soil-fem-3d.exe --output runs/ci/low-preload-nc-step32 --budget-seconds 60 --grace-seconds 5 --excavation-increment .03125 --maximum-newton-iterations 12 2>&1 | Tee-Object -FilePath runs/ci/low-preload-nc-step32.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probe_low_preload_nc.py --solver target/release/soil-fem-3d.exe --output runs/ci/low-preload-nc-step64 --budget-seconds 60 --grace-seconds 5 --excavation-increment .015625 --maximum-newton-iterations 12 2>&1 | Tee-Object -FilePath runs/ci/low-preload-nc-step64.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/low_preload_nc_reference.py --output runs/ci/low-preload-nc-reference128 --steps 128 --method rk4 --budget-seconds 120 2>&1 | Tee-Object -FilePath runs/ci/low-preload-nc-reference128.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/low_preload_nc_reference.py --output runs/ci/low-preload-nc-reference256 --steps 256 --method rk4 --budget-seconds 120 2>&1 | Tee-Object -FilePath runs/ci/low-preload-nc-reference256.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save source fingerprints and verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fem-windows-${{ matrix.group }}-${{ github.sha }}
          path: |
            runs/ci/*.json
            runs/ci/*.log
            runs/ci/wet-structures/verification.json
            runs/ci/wet-structures/stage-results.json
            runs/ci/wet-structures/mesh.json
            runs/ci/wet-structures/ground.json
            runs/ci/wet-structures/stages.json
            runs/ci/soil-wet-structures/**
            runs/ci/soil-source-wet-structures/**
            runs/ci/fixed-prescribed-wet-structures/**
            runs/ci/low-preload-nc/**
            !runs/ci/low-preload-nc/job/solver/**
            runs/ci/low-preload-nc-step32/**
            runs/ci/low-preload-nc-step64/**
            !runs/ci/low-preload-nc-step32/job/solver/**
            !runs/ci/low-preload-nc-step64/job/solver/**
            runs/ci/low-preload-nc-reference128/**
            runs/ci/low-preload-nc-reference256/**
          if-no-files-found: warn
          retention-days: 14

  windows-fem:
    name: Rust and Python on Windows
    needs: windows-checks
    if: always()
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Require every verification group
        shell: pwsh
        env:
          GROUP_RESULT: ${{ needs.windows-checks.result }}
        run: |
          if ($env:GROUP_RESULT -ne 'success') {
            throw "Windows verification group result: $env:GROUP_RESULT"
          }
